<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Casting a Dream app icon: black tile with an open neon ring and a glowing orb in the gap.
       Rendered to Resources/AppIcon.icns by scripts/render-icon.sh. Tile follows the macOS icon grid (824px, r=185). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121218"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="neon" x1="250" y1="250" x2="780" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.45" stop-color="#7a5cff"/>
      <stop offset="0.85" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="34" result="wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="near"/>
      <feMerge>
        <feMergeNode in="wide"/>
        <feMergeNode in="wide"/>
        <feMergeNode in="near"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- Shadow on its own layer: filtering the gradient tile directly causes banding -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>

  <g clip-path="url(#tileClip)">
    <!-- Open ring: 300° arc from -15° to -75°, gap at the upper right -->
    <g filter="url(#glow)">
      <path d="M 734.2 452.5 A 230 230 0 1 1 571.5 289.8"
            fill="none" stroke="url(#neon)" stroke-width="58" stroke-linecap="round"/>
      <circle cx="674.6" cy="349.4" r="32" fill="#00f0ff"/>
    </g>
    <!-- Hot tube cores -->
    <path d="M 734.2 452.5 A 230 230 0 1 1 571.5 289.8"
          fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="16" stroke-linecap="round"/>
    <circle cx="674.6" cy="349.4" r="13" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
